name: NAS container

on:
  push:
    branches: [main]
    # NAS releases have separate tags from inherited Windows desktop releases.
    tags: ['nas-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/karuboniru/luna
  PNPM_VERSION: 10.33.0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install production dependencies from npm
        run: |
          npm install --global pnpm@"$PNPM_VERSION" --registry=https://registry.npmjs.org
          pnpm install --prod --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: NAS regression tests
        run: npm run test:nas
      - name: Build local smoke-test image
        run: docker build --tag luna:nas-test .
      - name: Check container root and subpath startup
        run: |
          set -euo pipefail
          for prefix in '' '/luna'; do
            container=$(docker run --detach --env BASE_PATH="$prefix" luna:nas-test)
            healthy=false
            for attempt in $(seq 1 30); do
              if docker exec "$container" node tools/check/container-health.mjs; then
                healthy=true
                break
              fi
              sleep 1
            done
            docker logs "$container"
            docker rm --force "$container"
            test "$healthy" = true
          done

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'karuboniru/Luna'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate NAS release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^nas-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Luna NAS
            org.opencontainers.image.description=Luna browser server for Linux and NAS
      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
